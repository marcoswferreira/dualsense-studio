name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Automated Unit & Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --workspace

  build:
    name: Build Release Binaries (${{ matrix.target }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: dualsense-studio
            artifact_name: dualsense-studio-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: dualsense-studio.exe
            artifact_name: dualsense-studio-windows-x86_64.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Workspace
        run: cargo build --workspace --release --target ${{ matrix.target }}
