name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend TypeCheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript TypeCheck
        run: npx tsc --noEmit

      - name: Build Production UI Bundle
        run: npm run build

      - name: Upload Compiled UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/dualsense-app/ui/
          retention-days: 3

  rust-lint:
    name: Rust Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux HID Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Automated Unit, E2E & Regression Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux HID Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --workspace --lib

      - name: Run Core E2E Tests
        run: cargo test -p dualsense-core --test e2e_workflows

      - name: Run Regression Test Suite
        run: cargo test -p dualsense-core --test regression_suite

      - name: Run App E2E Tests (Binary + HTTP API)
        run: cargo test -p dualsense-app --test e2e_app

  package:
    name: Build Standalone Package (${{ matrix.platform }})
    needs: [frontend, rust-lint, rust-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: dualsense-studio
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary_name: dualsense-studio.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux HID Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Download Compiled UI Artifact
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: crates/dualsense-app/ui/

      - name: Build Release Binary
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package Linux Tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          STAGE="dist/dualsense-studio-${{ matrix.platform }}"
          mkdir -p "$STAGE/ui"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGE/"
          cp -r crates/dualsense-app/ui/* "$STAGE/ui/"
          cp README.md LICENSE "$STAGE/"
          cp packaging/linux/70-dualsense.rules "$STAGE/"
          tar -C dist -czf "dist/dualsense-studio-${{ matrix.platform }}.tar.gz" "dualsense-studio-${{ matrix.platform }}"
          (cd dist && sha256sum "dualsense-studio-${{ matrix.platform }}.tar.gz" > "dualsense-studio-${{ matrix.platform }}.sha256")

      - name: Package Windows Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\dualsense-studio-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "$stage\ui" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" "$stage\"
          Copy-Item -Recurse "crates\dualsense-app\ui\*" "$stage\ui\"
          Copy-Item "README.md", "LICENSE" "$stage\"
          $zip = "dist\dualsense-studio-${{ matrix.platform }}.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  dualsense-studio-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "dist\dualsense-studio-${{ matrix.platform }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dualsense-studio-${{ matrix.platform }}
          path: |
            dist/dualsense-studio-${{ matrix.platform }}.tar.gz
            dist/dualsense-studio-${{ matrix.platform }}.zip
            dist/dualsense-studio-${{ matrix.platform }}.sha256
          retention-days: 14
