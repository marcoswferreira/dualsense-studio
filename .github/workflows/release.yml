name: Release CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux HID Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Compiled UI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-ui-dist
          path: crates/dualsense-app/ui/
          retention-days: 1

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting, Lints & Tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

  build-release:
    name: Build Release Archive (${{ matrix.platform }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: dualsense-studio
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary_name: dualsense-studio.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Release Tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Linux HID Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Download Compiled UI Artifact
        uses: actions/download-artifact@v8
        with:
          name: release-ui-dist
          path: crates/dualsense-app/ui/

      - name: Build Release Binary
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package Linux Release Tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARCHIVE="dualsense-studio-${TAG}-${{ matrix.platform }}.tar.gz"
          STAGE="release/dualsense-studio-${TAG}-${{ matrix.platform }}"
          mkdir -p "$STAGE/ui"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGE/"
          cp -r crates/dualsense-app/ui/* "$STAGE/ui/"
          cp README.md LICENSE packaging/linux/70-dualsense.rules "$STAGE/"
          tar -C release -czf "release/${ARCHIVE}" "dualsense-studio-${TAG}-${{ matrix.platform }}"
          (cd release && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Package Windows Release Zip & Setup Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = $tag.TrimStart('v')
          $archive = "dualsense-studio-$tag-${{ matrix.platform }}.zip"
          $stage = "release\dualsense-studio-$tag-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "$stage\ui" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" "$stage\"
          Copy-Item -Recurse "crates\dualsense-app\ui\*" "$stage\ui\"
          Copy-Item "README.md", "LICENSE" "$stage\"
          Compress-Archive -Path "$stage\*" -DestinationPath "release\$archive" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "release\$archive").Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "release\$archive.sha256"

          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if ($iscc) {
            $setupBase = "dualsense-studio-$tag-${{ matrix.platform }}-setup"
            & $iscc "/DAppVersion=$version" "/DSourceDir=..\..\$stage" "/DOutputDir=..\..\release" "/DOutputBaseFilename=$setupBase" "packaging\windows\dualsense-studio.iss"
            $setupExe = "$setupBase.exe"
            $setupHash = (Get-FileHash -Algorithm SHA256 "release\$setupExe").Hash.ToLower()
            "$setupHash  $setupExe" | Out-File -Encoding ascii "release\$setupExe.sha256"
          }

      - name: Upload Release Platform Bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*-setup.exe
            release/*.sha256
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Release Tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download All Release Bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate Unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARGS=(--generate-notes --title "DualSense Studio ${TAG}")
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* "${ARGS[@]}"
          fi
