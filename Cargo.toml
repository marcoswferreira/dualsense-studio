[workspace]
members = [
    "crates/dualsense-core",
    "crates/dualsense-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["marcoswferreira"]
license = "GPL-3.0-or-later"
repository = "https://github.com/marcoswferreira/dualsense-studio"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crc32fast = "1.4"
byteorder = "1.5"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.12"
dirs = "5.0"
